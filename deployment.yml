from flask import Flask, jsonify

app = Flask(__name__)

@app.route("/")
def home():
    return "Hello from Sayali Flask App 🚀"

@app.route("/health")
def health():
    return jsonify({
        "status": "healthy",
        "app": "sayali-flask-app"
    })

@app.route("/api/data")
def data():
    return jsonify({
        "name": "Sayali App",
        "type": "Flask API",
        "message": "Running successfully on container 🚀"
    })

if __name__ == "__main__":
    # IMPORTANT: required for containers (Kubernetes / Cloud Run)
    app.run(host="0.0.0.0", port=8080)
